name: Up to Date

on:
  pull_request:
    branches:
      - main

jobs:
  check-up-to-date:
    name: Up to Date with main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check if branch contains latest main
        run: |
          git fetch origin main

          if git merge-base --is-ancestor origin/main HEAD; then
            echo "PR branch contains the latest main."
          else
            echo "PR branch is behind main."
            echo "Please update your branch with the latest main."
            exit 1
          fi
